version: '1.1'

services:
  api_gateway:
    build: ./api_gateway
    ports:
      - "5000:5000"
    depends_on:
      - auth
      - notificatons
      - devices
    
  auth:
    build: ./auth
    
    ports:
      -"5001:5001"
    
    depends_on:
      - db

  db:
    image: postgres:latest
    container_name:  postgres_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nginx:
    image: nginx:latest
    container_name: nginx_gateway
    ports:
      -"80:80"
    volumes:
      -./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth
      - db

volumes:
  postgres_data:
